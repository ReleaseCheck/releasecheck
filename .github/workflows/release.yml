name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -buildvcs=false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Check diff whitespace
        run: git diff --check
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build CLI
        run: go build ./cmd/releasecheck
      - name: Validate release version
        shell: bash
        run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}-dev"
      - name: Build and inspect release archives
        shell: bash
        run: |
          bash scripts/test-release-checksums.sh
          bash scripts/build-release.sh "$GITHUB_REF_NAME"
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          (cd dist && sha256sum --check SHA256SUMS)

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archives
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Validate published archives
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Release ${GITHUB_REF_NAME}"
